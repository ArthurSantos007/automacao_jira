name: Playwright Tests & Xray Sync

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium

      - name: Executar testes Playwright
        run: npx playwright test --project=chromium
        continue-on-error: true

      - name: Autenticar na API do Xray Cloud
        if: always()
        id: xray_auth
        run: |
          BASE_URL="https://getxray.app"
          RESPONSE=$(curl -s -w "\n%{http_code}" -H "Content-Type: application/json" -X POST --data "{\"client_id\": \"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\": \"${{ secrets.XRAY_CLIENT_SECRET }}\"}" "$BASE_URL/authenticate")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Erro na autenticação do Xray! Código HTTP: $HTTP_CODE"
            echo "Resposta do servidor: $BODY"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | tr -d '"')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Enviar relatório JUnit para o Xray
        if: success()
        run: |
          BASE_URL="https://getxray.app"
          curl -f -H "Content-Type: text/xml" -H "Authorization: Bearer ${{ steps.xray_auth.outputs.token }}" --data-binary @results/junit.xml "$BASE_URL/import/execution/junit?projectKey=AQ"
